#========================================================
# Browser Configuration
#========================================================

browser=chrome

browser.private=false
browser.maximize=true
browser.headless=true

browser.window.width=1920
browser.window.height=1080

browser.disable.notifications=true
browser.disable.extensions=true
browser.disable.popup.blocking=true

#========================================================
# Wait Configuration
#========================================================

# Wait for complete page loading
page.load.timeout=20

# Explicit wait for all web elements
element.timeout=10

# Wait after switching browser tabs/windows (milliseconds)
tab.switch.delay=2000

#========================================================
# Application URLs
#========================================================

web.qa.url=https://qaplayground.com/practice/input-fields
web.tap.url=https://testautomationpractice.blogspot.com/

#========================================================
# Screenshot Configuration
#========================================================

capture.pass.screenshot=true
capture.fail.screenshot=true

#========================================================
# Extend Report Configuration
#========================================================

author=Lokesh
testing.type=Functional Testing
environment=QA Environment
framework.name=Hybrid Automation Framework
execution.type=Local
application.name=QA Playground
build.version=2.5.18
git.branch=
git.commit=

#========================================================
# Retry Analaser
#========================================================

retry.count=2

